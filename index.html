<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Codex制作物 URL一覧</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      body {
        margin: 0;
        padding: 2rem;
        max-width: 780px;
      }
      h1 {
        margin-top: 0;
      }
      .card {
        border: 1px solid #8884;
        border-radius: 12px;
        padding: 1rem;
        margin-bottom: 1rem;
      }
      form {
        display: grid;
        gap: 0.5rem;
      }
      label {
        font-weight: 600;
      }
      input {
        padding: 0.55rem 0.7rem;
        border-radius: 8px;
        border: 1px solid #8887;
      }
      button {
        width: fit-content;
        padding: 0.55rem 0.9rem;
        border: 0;
        border-radius: 8px;
        cursor: pointer;
        font-weight: 700;
      }
      .primary {
        background: #1f6feb;
        color: white;
      }
      .danger {
        background: #c93c37;
        color: white;
      }
      ul {
        padding-left: 1.1rem;
      }
      li {
        margin-bottom: 0.6rem;
      }
      .meta {
        color: #666;
        font-size: 0.9rem;
      }
      .actions {
        margin-top: 1rem;
      }
    </style>
  </head>
  <body>
    <h1>Codexで作ったもののURL一覧</h1>
    <p>タイトルとURLを追加すると、ブラウザに保存されます（localStorage）。</p>

    <section class="card">
      <form id="url-form">
        <label for="title">タイトル</label>
        <input id="title" name="title" placeholder="例: ポートフォリオLP" required />

        <label for="url">URL</label>
        <input id="url" name="url" type="url" placeholder="https://example.com" required />

        <button type="submit" class="primary">追加</button>
      </form>
    </section>

    <section class="card">
      <h2>URLリスト</h2>
      <ul id="url-list"></ul>
      <p id="empty" class="meta">まだURLがありません。上のフォームから追加してください。</p>
      <div class="actions">
        <button id="clear" type="button" class="danger">全削除</button>
      </div>
    </section>

    <script>
      const STORAGE_KEY = "codex_url_list";
      const STORAGE_INIT_KEY = "codex_url_list_initialized_v2";
      const DEFAULT_ITEMS = [
        { title: "ノートアプリ", url: "https://ny-note.vercel.app" },
        {
          title: "カードゲーム",
          url: "https://ny-wk-git-codex-add-card-game-transition-button-oqibav-ny1.vercel.app",
        },
        { title: "スト6", url: "https://ai-colab-six.vercel.app/" },
      ];
      const listEl = document.getElementById("url-list");
      const emptyEl = document.getElementById("empty");
      const formEl = document.getElementById("url-form");
      const clearEl = document.getElementById("clear");
      const titleInputEl = document.getElementById("title");
      const urlInputEl = document.getElementById("url");

      function normalizeItems(parsed) {
        if (Array.isArray(parsed)) {
          return parsed.filter((item) => item && item.title && item.url);
        }

        // 互換対応: 以前の実装で単体オブジェクトが保存されていても配列へ変換する
        if (parsed && typeof parsed === "object" && parsed.title && parsed.url) {
          return [parsed];
        }

        return [];
      }

      function mergeDefaults(items) {
        const byUrl = new Map();

        items.forEach((item) => {
          byUrl.set(item.url, { ...item });
        });

        DEFAULT_ITEMS.forEach((item) => {
          if (!byUrl.has(item.url)) {
            byUrl.set(item.url, { ...item });
          }
        });

        return Array.from(byUrl.values());
      }

      function loadItems() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (!raw) {
            return mergeDefaults([]);
          }

          return normalizeItems(JSON.parse(raw));
        } catch {
          return mergeDefaults([]);
        }
      }

      function ensureDefaultsInitialized() {
        const initialized = localStorage.getItem(STORAGE_INIT_KEY);
        if (initialized) {
          return;
        }

        const merged = mergeDefaults(loadItems());
        saveItems(merged);
        localStorage.setItem(STORAGE_INIT_KEY, "1");
      }

      function saveItems(items) {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(items));
      }

      function render() {
        const items = loadItems();
        listEl.innerHTML = "";

        items.forEach((item, index) => {
          const li = document.createElement("li");
          const link = document.createElement("a");
          const remove = document.createElement("button");

          link.href = item.url;
          link.textContent = `${item.title} (${item.url})`;
          link.target = "_blank";
          link.rel = "noopener noreferrer";

          remove.textContent = "削除";
          remove.style.marginLeft = "0.6rem";
          remove.addEventListener("click", () => {
            const next = loadItems();
            next.splice(index, 1);
            saveItems(next);
            render();
          });

          li.append(link, remove);
          listEl.append(li);
        });

        emptyEl.hidden = items.length > 0;
      }

      formEl.addEventListener("submit", (event) => {
        event.preventDefault();
        const title = titleInputEl.value.trim();
        const url = urlInputEl.value.trim();

        if (!title || !url) {
          return;
        }

        const items = loadItems();
        items.push({ title, url });
        saveItems(items);
        formEl.reset();
        render();
      });

      clearEl.addEventListener("click", () => {
        saveItems([]);
        render();
      });

      ensureDefaultsInitialized();
      render();
    </script>
  </body>
</html>
