<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Codex 制作物</title>
    <style>
      :root {
        --bg:             #f4f5f7;
        --surface:        #ffffff;
        --surface-form:   #ffffff;
        --border:         rgba(0, 0, 0, 0.08);
        --border-focus:   #3b82f6;
        --text-primary:   #111827;
        --text-secondary: #6b7280;
        --text-url:       #3b82f6;
        --accent:         #3b82f6;
        --accent-hover:   #2563eb;
        --danger:         #ef4444;
        --shadow-sm:      0 1px 3px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
        --shadow-hover:   0 4px 14px rgba(0,0,0,0.10);
        --radius:         14px;
        --radius-sm:      9px;
        color-scheme: light dark;
        font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans",
                     "Yu Gothic UI", system-ui, sans-serif;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --bg:             #0d0f14;
          --surface:        #181b22;
          --surface-form:   #1c2028;
          --border:         rgba(255, 255, 255, 0.09);
          --text-primary:   #e8eaf0;
          --text-secondary: #8b909a;
          --text-url:       #60a5fa;
          --shadow-sm:      0 1px 3px rgba(0,0,0,0.35);
          --shadow-hover:   0 4px 14px rgba(0,0,0,0.50);
        }
      }

      *, *::before, *::after { box-sizing: border-box; }

      body {
        margin: 0 auto;
        padding: 1.75rem 1rem 4rem;
        max-width: 560px;
        background: var(--bg);
        color: var(--text-primary);
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      /* ── Header ── */
      header {
        margin-bottom: 2rem;
      }
      header h1 {
        font-size: 1.2rem;
        font-weight: 700;
        letter-spacing: -0.015em;
        margin: 0 0 0.3rem;
      }
      header p {
        font-size: 0.82rem;
        color: var(--text-secondary);
        margin: 0;
      }

      /* ── Section label ── */
      .section-label {
        font-size: 0.7rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--text-secondary);
        margin: 0 0 0.65rem;
      }

      /* ── Form card ── */
      .form-card {
        background: var(--surface-form);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 1.25rem 1.25rem 1.1rem;
        margin-bottom: 1.75rem;
        box-shadow: var(--shadow-sm);
      }

      .field + .field {
        margin-top: 0.75rem;
      }

      label {
        display: block;
        font-size: 0.78rem;
        font-weight: 600;
        color: var(--text-secondary);
        margin-bottom: 0.35rem;
      }

      input {
        display: block;
        width: 100%;
        padding: 0.65rem 0.85rem;
        border-radius: var(--radius-sm);
        border: 1.5px solid var(--border);
        background: var(--bg);
        color: var(--text-primary);
        font-size: 0.95rem;
        font-family: inherit;
        outline: none;
        transition: border-color 0.15s, box-shadow 0.15s;
        -webkit-appearance: none;
      }
      input:focus {
        border-color: var(--border-focus);
        box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.18);
      }
      input::placeholder {
        color: var(--text-secondary);
        opacity: 0.55;
      }

      /* ── Buttons ── */
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 0.4rem;
        border: 0;
        border-radius: var(--radius-sm);
        cursor: pointer;
        font-weight: 600;
        font-size: 0.9rem;
        font-family: inherit;
        min-height: 44px;
        transition: background 0.15s, box-shadow 0.15s, transform 0.1s;
        -webkit-tap-highlight-color: transparent;
        text-decoration: none;
      }
      .btn:active { transform: scale(0.97); }

      .btn-primary {
        background: var(--accent);
        color: #fff;
        width: 100%;
        margin-top: 1rem;
        padding: 0 1.25rem;
        box-shadow: 0 1px 4px rgba(59,130,246,0.3);
      }
      .btn-primary:hover { background: var(--accent-hover); }

      .btn-clear {
        background: transparent;
        color: var(--danger);
        border: 1px solid rgba(239, 68, 68, 0.28);
        padding: 0 0.9rem;
        font-size: 0.8rem;
        min-height: 36px;
      }
      .btn-clear:hover { background: rgba(239, 68, 68, 0.07); }

      /* ── List section ── */
      .list-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 0.65rem;
      }
      .list-count {
        font-size: 0.75rem;
        color: var(--text-secondary);
        font-weight: 500;
      }

      .url-list {
        list-style: none;
        padding: 0;
        margin: 0;
        display: flex;
        flex-direction: column;
        gap: 0.55rem;
      }

      /* ── URL card ── */
      .url-item {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        box-shadow: var(--shadow-sm);
        display: flex;
        align-items: center;
        gap: 0.6rem;
        padding: 0.85rem 0.75rem 0.85rem 1rem;
        transition: box-shadow 0.15s, border-color 0.15s;
      }
      .url-item:hover {
        box-shadow: var(--shadow-hover);
        border-color: rgba(59, 130, 246, 0.18);
      }

      .url-item-body {
        flex: 1;
        min-width: 0;
      }

      .url-item-title {
        font-size: 0.95rem;
        font-weight: 600;
        color: var(--text-primary);
        text-decoration: none;
        display: block;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        margin-bottom: 0.18rem;
      }
      .url-item-title:hover { color: var(--accent); }

      .url-item-address {
        font-size: 0.72rem;
        color: var(--text-url);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        display: block;
        opacity: 0.82;
      }

      /* ── Delete icon button ── */
      .btn-delete {
        flex-shrink: 0;
        background: transparent;
        border: 0;
        cursor: pointer;
        color: var(--text-secondary);
        width: 36px;
        height: 36px;
        padding: 0;
        border-radius: 8px;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: background 0.15s, color 0.15s;
        -webkit-tap-highlight-color: transparent;
      }
      .btn-delete:hover {
        background: rgba(239, 68, 68, 0.1);
        color: var(--danger);
      }
      .btn-delete svg { display: block; pointer-events: none; }

      /* ── Empty state ── */
      .empty-state {
        text-align: center;
        padding: 2.5rem 1rem;
        color: var(--text-secondary);
        font-size: 0.88rem;
        line-height: 1.7;
      }

      /* ── Footer actions ── */
      .footer-actions {
        display: flex;
        justify-content: flex-end;
        margin-top: 0.9rem;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Codex 制作物</h1>
      <p>タイトルとURLを登録すると、ブラウザに保存されます。</p>
    </header>

    <!-- 追加フォーム -->
    <section>
      <p class="section-label">新規追加</p>
      <div class="form-card">
        <form id="url-form">
          <div class="field">
            <label for="title">タイトル</label>
            <input id="title" name="title" placeholder="例: ポートフォリオ" required autocomplete="off" />
          </div>
          <div class="field">
            <label for="url">URL</label>
            <input id="url" name="url" type="url" placeholder="https://example.com" required autocomplete="off" />
          </div>
          <button type="submit" class="btn btn-primary">追加する</button>
        </form>
      </div>
    </section>

    <!-- 登録済みリスト -->
    <section>
      <div class="list-header">
        <p class="section-label" style="margin:0">登録済み</p>
        <span class="list-count" id="list-count"></span>
      </div>
      <ul class="url-list" id="url-list"></ul>
      <p id="empty" class="empty-state">
        まだURLがありません。<br>上のフォームから追加してください。
      </p>
      <div class="footer-actions" id="footer-actions" hidden>
        <button id="clear" type="button" class="btn btn-clear">すべて削除</button>
      </div>
    </section>

    <script>
      const STORAGE_KEY      = "codex_url_list";
      const STORAGE_INIT_KEY = "codex_url_list_initialized_v2";
      const DEFAULT_ITEMS    = [
        { title: "ノートアプリ",  url: "https://ny-note.vercel.app" },
        { title: "カードゲーム", url: "https://ny-wk-git-codex-add-card-game-transition-button-oqibav-ny1.vercel.app" },
        { title: "スト6",        url: "https://ai-colab-six.vercel.app/" },
      ];

      const listEl         = document.getElementById("url-list");
      const emptyEl        = document.getElementById("empty");
      const formEl         = document.getElementById("url-form");
      const clearEl        = document.getElementById("clear");
      const titleInputEl   = document.getElementById("title");
      const urlInputEl     = document.getElementById("url");
      const listCountEl    = document.getElementById("list-count");
      const footerActionsEl = document.getElementById("footer-actions");

      const TRASH_SVG = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none"
        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="3 6 5 6 21 6"/>
        <path d="M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6"/>
        <path d="M10 11v6"/><path d="M14 11v6"/>
        <path d="M9 6V4h6v2"/>
      </svg>`;

      function normalizeItems(parsed) {
        if (Array.isArray(parsed)) {
          return parsed.filter((item) => item && item.title && item.url);
        }
        if (parsed && typeof parsed === "object" && parsed.title && parsed.url) {
          return [parsed];
        }
        return [];
      }

      function mergeDefaults(items) {
        const byUrl = new Map();
        items.forEach((item) => byUrl.set(item.url, { ...item }));
        DEFAULT_ITEMS.forEach((item) => {
          if (!byUrl.has(item.url)) byUrl.set(item.url, { ...item });
        });
        return Array.from(byUrl.values());
      }

      function loadItems() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (!raw) return mergeDefaults([]);
          return normalizeItems(JSON.parse(raw));
        } catch {
          return mergeDefaults([]);
        }
      }

      function saveItems(items) {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(items));
      }

      function ensureDefaultsInitialized() {
        if (localStorage.getItem(STORAGE_INIT_KEY)) return;
        saveItems(mergeDefaults(loadItems()));
        localStorage.setItem(STORAGE_INIT_KEY, "1");
      }

      function render() {
        const items    = loadItems();
        const hasItems = items.length > 0;
        listEl.innerHTML        = "";
        emptyEl.hidden          = hasItems;
        footerActionsEl.hidden  = !hasItems;
        listCountEl.textContent = hasItems ? `${items.length} 件` : "";

        items.forEach((item, index) => {
          const li = document.createElement("li");
          li.className = "url-item";

          // Body: title link + URL address
          const body = document.createElement("div");
          body.className = "url-item-body";

          const titleLink = document.createElement("a");
          titleLink.href      = item.url;
          titleLink.textContent = item.title;
          titleLink.target    = "_blank";
          titleLink.rel       = "noopener noreferrer";
          titleLink.className = "url-item-title";

          const urlSpan = document.createElement("span");
          urlSpan.textContent = item.url;
          urlSpan.className   = "url-item-address";

          body.append(titleLink, urlSpan);

          // Delete button
          const removeBtn = document.createElement("button");
          removeBtn.className        = "btn-delete";
          removeBtn.setAttribute("aria-label", `${item.title}を削除`);
          removeBtn.innerHTML        = TRASH_SVG;
          removeBtn.addEventListener("click", () => {
            const next = loadItems();
            next.splice(index, 1);
            saveItems(next);
            render();
          });

          li.append(body, removeBtn);
          listEl.append(li);
        });
      }

      formEl.addEventListener("submit", (e) => {
        e.preventDefault();
        const title = titleInputEl.value.trim();
        const url   = urlInputEl.value.trim();
        if (!title || !url) return;
        const items = loadItems();
        items.push({ title, url });
        saveItems(items);
        formEl.reset();
        render();
      });

      clearEl.addEventListener("click", () => {
        if (!confirm("登録済みのURLをすべて削除しますか？")) return;
        saveItems([]);
        render();
      });

      ensureDefaultsInitialized();
      render();
    </script>
  </body>
</html>
